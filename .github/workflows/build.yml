name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Tests de la lógica del marcador
        run: gradle :app:testDebugUnitTest
      - name: Preparar clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.BANDEJA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bandeja.jks"
            echo "BANDEJA_KEYSTORE=$RUNNER_TEMP/bandeja.jks" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK
        env:
          BANDEJA_KEYSTORE_PASSWORD: ${{ secrets.BANDEJA_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Bandeja.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bandeja-apk
          path: Bandeja.apk
      - name: Publicar en Releases (descarga directa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Bandeja.apk --title "Bandeja $TAG" --notes "APK para Wear OS (Galaxy Watch)." --latest
